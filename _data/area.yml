meta:
  name: Orchestration
  description: An index and topic collection covering container orchestration and
    workflow orchestration platforms. Container orchestration platforms like Kubernetes,
    OpenShift, Amazon EKS, Google Kubernetes Engine, and Azure Kubernetes Service
    schedule and manage containerized workloads across clusters of machines, handling
    deployment, scaling, networking, and self-healing. Workflow orchestration engines
    like Temporal, Apache Airflow, Argo Workflows, AWS Step Functions, Prefect, Dagster,
    and Kestra coordinate the execution of long-running, multi-step business processes,
    data pipelines, and durable workflows. This collection brings together the operators,
    schedulers, control planes, and durable execution engines that turn declarative
    specifications into running systems.
  tags:
  - Orchestration
  - Container Orchestration
  - Workflow Orchestration
  - Kubernetes
  - Scheduler
  portal: https://apievangelist.com
  github: https://github.com/api-evangelist
  repo: orchestration
