features:
- name: Declarative Workload Scheduling
  description: Container orchestrators like Kubernetes, Nomad, and ECS take declarative
    workload specifications (pods, jobs, services) and continuously reconcile cluster
    state to match the desired configuration.
- name: Horizontal and Event-Driven Autoscaling
  description: Platforms like Kubernetes HPA, KEDA, and Karpenter scale workloads
    and underlying nodes based on CPU, memory, custom metrics, or external event sources
    such as queue depth.
- name: Durable Workflow Execution
  description: Workflow engines like Temporal, AWS Step Functions, and Inngest provide
    durable, fault-tolerant execution for long-running, multi-step business processes
    that survive process restarts and infrastructure failures.
- name: Data Pipeline Orchestration
  description: Data orchestrators like Apache Airflow, Prefect, Dagster, and Kestra
    schedule and monitor DAG-based data pipelines across batch, streaming, and ML
    workloads.
- name: GitOps and Continuous Deployment
  description: GitOps controllers like Argo CD and Flux CD reconcile Git-defined manifests
    into running Kubernetes clusters, enabling auditable, declarative continuous deployment.
- name: Multi-Cluster and Hybrid Cloud Control Planes
  description: Platforms like Rancher, OpenShift, VMware Tanzu, Mirantis, and Crossplane
    provide unified control planes for managing multiple Kubernetes clusters and cloud
    resources across on-prem and public cloud.
- name: Serverless Containers and Functions
  description: Services like AWS Fargate, Knative, and Google Cloud Run abstract away
    node management, running containers and functions on managed infrastructure billed
    per request or per second.
use_cases:
- name: Microservices Platform
  description: Engineering organizations deploy Kubernetes (EKS, GKE, AKS, OpenShift)
    as a microservices platform, running hundreds of services with service discovery,
    rolling deployments, and automated recovery.
- name: Batch and Stream Data Pipelines
  description: Data teams use Airflow, Dagster, Prefect, or Kestra to orchestrate
    ETL/ELT pipelines, ML training workflows, and reporting jobs across warehouses,
    lakes, and streaming sources.
- name: Durable Business Process Workflows
  description: Product teams use Temporal, AWS Step Functions, Conductor, or Inngest
    to implement order processing, payments, and approval workflows that must survive
    failures over hours, days, or months.
- name: GitOps Continuous Delivery
  description: Platform teams use Argo CD or Flux CD to deliver application changes
    to many clusters by promoting Git commits across environments with full auditability.
- name: Hybrid Cloud Cluster Fleet Management
  description: Enterprises use Rancher, Tanzu, Mirantis Kubernetes Engine, or OpenShift
    to manage fleets of Kubernetes clusters across on-prem datacenters and multiple
    public clouds from one control plane.
- name: Event-Driven Background Jobs
  description: Application teams use Inngest, Trigger.dev, KEDA, or Cloud Scheduler
    to run background jobs triggered by HTTP events, queue messages, schedules, or
    webhook deliveries.
- name: AI Agent Workflow Orchestration
  description: AI teams use durable workflow engines like Temporal and Inngest to
    orchestrate long-running agent workflows, tool calls, and human-in-the-loop approvals
    with retries and replay.
integrations:
- name: Kubernetes
  description: The de facto container orchestration platform from CNCF for declarative
    scheduling, scaling, and management of containerized workloads.
- name: Amazon EKS
  description: AWS managed Kubernetes service with deep integration into IAM, VPC,
    Fargate, and other AWS services.
- name: Google Kubernetes Engine
  description: Google Cloud's managed Kubernetes service with Autopilot, multi-cluster
    mesh, and tight integration with GCP networking and observability.
- name: Argo Workflows
  description: Kubernetes-native workflow engine for running DAGs of containerized
    steps for CI/CD, ML, and data processing.
- name: Temporal
  description: Durable execution platform for building long-running, fault-tolerant
    workflows with code-defined state machines.
- name: Apache Airflow
  description: Open-source workflow orchestration platform for authoring, scheduling,
    and monitoring DAG-based data pipelines.
- name: AWS Step Functions
  description: Serverless workflow service for coordinating AWS Lambda functions and
    AWS services into multi-step state machines.
- name: Argo CD
  description: Declarative GitOps continuous delivery tool for Kubernetes that automates
    application deployment from Git repositories.
